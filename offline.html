<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2457d6">
  <title>You’re offline · Smart Revision</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#17233b;background:#f5f7fb}
    *{box-sizing:border-box}
    body{min-height:100vh;margin:0;display:grid;place-items:center;padding:1rem}
    main{max-width:34rem;padding:clamp(1.5rem,6vw,3rem);border:1px solid #e4e9f2;border-radius:1.5rem;background:#fff;box-shadow:0 12px 40px #17233b12;text-align:center}
    .icon{font-size:3rem}.pill{display:inline-block;margin:.5rem 0;padding:.4rem .75rem;border-radius:99px;background:#e7f7ee;color:#17663b;font-weight:700}
    a{display:inline-block;margin-top:1rem;padding:.8rem 1rem;border-radius:.8rem;background:#2457d6;color:#fff;text-decoration:none;font-weight:700}
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">🌤️</div>
    <h1>You’re offline</h1>
    <p>Your internet connection isn’t available right now.</p>
    <p class="pill">Previously loaded questions are saved on this device.</p>
    <p>Try opening Smart Revision again. If this is your first visit, connect to the internet once to prepare the app for offline learning.</p>
    <a href="./index.html">Try again</a>
  </main>
</body>
</html>
